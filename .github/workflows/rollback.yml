name: Production Rollback & Recovery Orchestrator

on:
  workflow_dispatch:
    inputs:
      target_release_id:
        description: 'Target Release ID to roll back to (e.g. rel-20260918-a1b2c3d4)'
        required: true
      target_environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      reason:
        description: 'Reason for invoking emergency rollback'
        required: true
      skip_db_check:
        description: 'Force application rollback without database rollback (default: true - schema is forward compatible)'
        required: true
        type: boolean
        default: true

jobs:
  rollback:
    name: Execute Emergency Rollback
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless verified rollback adapter is available
        run: node scripts/release-preflight.mjs rollback
      - name: Validate the target artifact and forward-compatibility
        env:
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          SKIP_DB_CHECK: ${{ inputs.skip_db_check }}
        run: ./infrastructure/deployment/adapters/rollback.sh validate
      - name: Roll back application ingress
        env:
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: ./infrastructure/deployment/adapters/rollback.sh traffic
      - name: Drain and restore background workers
        env:
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: ./infrastructure/deployment/adapters/rollback.sh workers
      - name: Verify restored release health
        env:
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: ./infrastructure/deployment/adapters/rollback.sh verify
