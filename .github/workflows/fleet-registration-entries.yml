name: Fleet Registration Entries Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/database/src/repositories/fleet-registration-entry.repository.ts'
      - 'packages/database/src/index.ts'
      - 'apps/api/src/modules/fleet/**'
      - 'src/components/FleetExperienceView.tsx'
      - 'scripts/fleet-registration-entry-acceptance.ts'
      - '.github/workflows/fleet-registration-entries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accept:
    name: Real DB entries, conversion, RBAC, idempotency and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript
        run: pnpm typecheck
      - name: Build real frontend
        run: pnpm build
      - name: Provision isolated tenant and 20 role accounts
        run: |
          (pnpm review:api >/tmp/fleet-intake-api.log 2>&1 & echo $! >/tmp/fleet-intake.pid)
          for i in $(seq 1 120); do
            if grep -q 'READY: 20 role accounts' /tmp/fleet-intake-api.log; then exit 0; fi
            sleep 1
          done
          tail -n 30 /tmp/fleet-intake-api.log
          exit 1
      - name: API and SQLite fleet-entry integration
        env:
          NODE_ENV: test
          APP_ENV: test
          SQLITE_PATH: .review/access/review.sqlite
        run: pnpm exec tsx scripts/fleet-registration-entry-acceptance.ts
      - name: Diagnostics on failure
        if: failure()
        run: tail -n 35 /tmp/fleet-intake-api.log 2>/dev/null || true
      - name: Remove isolated database and credentials
        if: always()
        run: |
          if test -f /tmp/fleet-intake.pid; then kill "$(cat /tmp/fleet-intake.pid)" 2>/dev/null || true; fi
          rm -rf .review/access
