name: Stage 4–6 Cross-Workflow Integration Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/stage4-browser-acceptance.mjs'
      - 'scripts/stage4-live-closure-acceptance.ts'
      - 'scripts/stage5-browser-journey.mjs'
      - 'scripts/stage6-cross-workflow.ts'
      - 'packages/database/test/stage6-http-boundary.test.ts'
      - 'apps/api/src/common/filters/http-exception.filter.ts'
      - 'scripts/release-preflight.mjs'
      - 'scripts/release-preflight.test.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/rollback.yml'
      - 'scripts/access-review.ts'
      - 'src/**'
      - 'apps/api/**'
      - 'packages/database/src/**'
      - '.github/workflows/stage4-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-review:
    name: Six-role browser and full booking-to-release API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify staging, production, and rollback cannot silently succeed
        run: node scripts/release-preflight.test.mjs
      - name: Validate canonical cross-domain HTTP failure responses
        run: pnpm exec tsx packages/database/test/stage6-http-boundary.test.ts
      - name: Locate installed Chromium
        run: |
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser
      - name: Start isolated review API and provision 20 unique roles
        run: |
          rm -rf .review/access
          (pnpm review:api > /tmp/sage-stage4-api.log 2>&1 & echo $! > /tmp/sage-stage4-api.pid)
          for i in $(seq 1 120); do
            if grep -q 'READY: 20 role accounts' /tmp/sage-stage4-api.log; then exit 0; fi
            if grep -qE 'Error:|Fatal|Unhandled|ELIFECYCLE' /tmp/sage-stage4-api.log; then
              echo 'Review API setup failed'; tail -n 15 /tmp/sage-stage4-api.log; exit 1
            fi
            sleep 1
          done
          echo 'Review API startup timed out'; tail -n 20 /tmp/sage-stage4-api.log; exit 1
      - name: Start real web application with isolated API proxy
        run: |
          (pnpm review:web > /tmp/sage-stage4-web.log 2>&1 & echo $! > /tmp/sage-stage4-web.pid)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3510/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Review Vite startup timed out'; tail -n 20 /tmp/sage-stage4-web.log; exit 1
      - name: Live authenticated zero-balance rental closure across Finance and Operations
        env:
          NODE_ENV: test
          APP_ENV: test
          SQLITE_PATH: .review/access/review.sqlite
        run: pnpm exec tsx scripts/stage4-live-closure-acceptance.ts
      - name: Read-only integrity scan of the completed isolated scenario
        env:
          SQLITE_PATH: .review/access/review.sqlite
        run: pnpm audit:closure -- --all-tenants
      - name: Authenticated six-role browser and server RBAC acceptance
        run: node scripts/stage4-browser-acceptance.mjs
      - name: Prepare unsealed rental in isolated review database
        env:
          NODE_ENV: test
          APP_ENV: test
          SQLITE_PATH: .review/access/review.sqlite
          STAGE5_PREPARE_ONLY: '1'
        run: pnpm exec tsx scripts/stage4-live-closure-acceptance.ts
      - name: Browser-driven multi-actor Return to Finance to fleet release
        run: node scripts/stage5-browser-journey.mjs
      - name: Read-only integrity scan after browser-driven closure
        env:
          SQLITE_PATH: .review/access/review.sqlite
        run: pnpm audit:closure -- --all-tenants
      - name: Stage 6 authenticated Booking to Contract to Handover to Rental to Finance integration
        env:
          NODE_ENV: test
          APP_ENV: test
          SQLITE_PATH: .review/access/review.sqlite
        run: pnpm exec tsx scripts/stage6-cross-workflow.ts
      - name: Read-only integrity audit after Stage 6 integration scenario
        env:
          SQLITE_PATH: .review/access/review.sqlite
        run: pnpm audit:closure -- --all-tenants
      - name: Safe diagnostic tails on failure
        if: failure()
        run: |
          echo '=== API service logs (last 30) ==='
          tail -n 30 /tmp/sage-stage4-api.log 2>/dev/null || true
          echo '=== Web service logs (last 20) ==='
          tail -n 20 /tmp/sage-stage4-web.log 2>/dev/null || true
      - name: Stop isolated services and remove temporary credentials
        if: always()
        run: |
          for pidfile in /tmp/sage-stage4-api.pid /tmp/sage-stage4-web.pid; do
            if test -f "$pidfile"; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
          rm -rf .review/access
