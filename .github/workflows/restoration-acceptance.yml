name: Restoration Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'apps/api/**'
      - 'packages/constants/**'
      - 'packages/database/test/access-onboarding.test.ts'
      - 'packages/database/test/public-booking-and-checkout.test.ts'
      - 'packages/database/test/email-delivery.test.ts'
      - 'packages/database/test/restoration-hardening.test.ts'
      - 'scripts/restoration-checkpoint.ts'
      - 'docs/restoration-*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/restoration-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restoration-acceptance:
    name: Restoration controls, access regressions & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Restoration hardening regression
        run: pnpm test:restoration

      - name: Account and 20-role access regression
        run: pnpm test:access

      - name: Public booking regression
        run: pnpm test:public-booking

      - name: Email adapter regression
        run: npx tsx packages/database/test/email-delivery.test.ts

      - name: Production build
        run: pnpm build
