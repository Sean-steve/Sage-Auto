name: Phase 4 — Cross-Portal Integration & Review Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/modules/access/**"
      - "src/components/VehicleOwnersView.tsx"
      - "src/components/platform/**"
      - "src/components/owner/**"
      - "src/lib/api-client.ts"
      - "scripts/stage4-browser-acceptance.mjs"
      - "packages/database/test/phase4-cross-portal-contract.test.ts"
      - "packages/database/test/access-onboarding.test.ts"
      - "packages/database/test/run-full-test-matrix.ts"
      - "package.json"
      - ".github/workflows/phase4-cross-portal-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-review:
    runs-on: ubuntu-latest
    name: Phase 4 cross-portal RBAC, state synchronization & build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck all portal components
        run: pnpm typecheck
      - name: Verify live API owner/operator state synchronization and revocation
        run: pnpm test:phase4
      - name: Verify platform-owner tenant and billing isolation
        run: pnpm test:platform-portal
      - name: Verify settlement payout authorization rules
        run: pnpm test:owner-settlements
      - name: Build integrated browser portal
        run: pnpm build
