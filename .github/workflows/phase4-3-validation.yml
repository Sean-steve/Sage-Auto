name: Phase 4.3 · Unified Frontend Validation
on:
  push:
    branches:
      - feat/phase4-3-unified-frontend-foundation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-and-regression:
    name: Typecheck · Build · Frontend contracts · Backend matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strict typecheck
        run: pnpm typecheck
      - name: Build React application
        run: pnpm build
      - name: Contract foundation assertions
        run: pnpm test:frontend-foundation
      - name: Full backend regression matrix
        run: pnpm test:all
